<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}"></title>
    <!--    <link rel="stylesheet" href="/hw1503/css/styles.css">-->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body style="margin:30px">
<div class="container" >
    <div class="top-menu"></div>
    <div class="output">
        <h1>Бижутерия</h1>
        <h2 th:text="${group_name}"></h2>
        <h3 th:text="${product.productName}"></h3>
        <image th:src="'/images/' + ${product.innerId} + '_b.jpg'" style="width:800px"/>
        <div class="price" th:text="${product.getPriceText()}"></div>
        <div class="articul" th:text="${product.articul}"></div>
    </div>
</div>
</body>
</html>
